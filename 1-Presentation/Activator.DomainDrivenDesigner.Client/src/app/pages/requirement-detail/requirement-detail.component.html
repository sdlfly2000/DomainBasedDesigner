<div class="requirement-detail-container">
    <H1>{{ ProjectName }} -> {{ title }}</H1>
    <p-divider />
    <p-toolbar>
        <ng-template #start>
            <requirement-detail-cmd-analyze [Description]="RequirementDescription" (AnalyzedResult) ="OnAnalyzedResult($event)"></requirement-detail-cmd-analyze>
        </ng-template>
    </p-toolbar>
    <div class="card">
        <div class="requirement-detail-description">
            <textarea rows="5"
                      cols="30"
                      pTextarea
                      name="requirementnewdescription"
                      [(ngModel)]="RequirementDescription"
                      placeholder="Requirement Description"
                      fluid></textarea>
        </div>

        <div class="card">
            <p-tabs value="0">
                <p-tablist>
                    @for (model of AnalyzedResult.businessModels; track model.name) {
                    <p-tab [value]="model.name">{{ model.name }}</p-tab>
                    }
                </p-tablist>
                <p-tabpanels>
                    @for (model of AnalyzedResult.businessModels; track model.name) {
                    <p-tabpanel [value]="model.name">
                        <p class="m-0">{{ model.name }}</p>
                    </p-tabpanel>
                    }
                </p-tabpanels>
            </p-tabs>
        </div>

        <div #mermaidContainer class="mermaid-target"></div>

        <div class="requirement-detail-analyzed">
            <textarea rows="10"
                      cols="30"
                      pTextarea
                      name="requirementanalyzed"
                      [(ngModel)]="AnalyzedResult.raw"
                      placeholder="AI Raw Output"
                      (ngModelChange)="OnAnalyzedResultChange($event)"
                      fluid></textarea>
        </div>
    </div>
</div>
