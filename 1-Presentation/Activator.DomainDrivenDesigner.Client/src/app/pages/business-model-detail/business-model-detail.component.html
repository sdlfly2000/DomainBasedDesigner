<div class="business-model-detail-container">
    <H1>{{ ProjectName }} -> {{ title }}</H1>
    <p-divider />
    <p-toolbar>
        <ng-template #start>
        </ng-template>
    </p-toolbar>
    <div class="flex">
        <div class="flex-1">
            @if(BusinessModel()){
            <div class="business-model-detail-description">
                <textarea rows="30"
                          cols="30"
                          pTextarea
                          name="businessmodeldescription"
                          [(ngModel)]="BusinessModel().contentMermaid"
                          placeholder="Business Model Description"
                          fluid>
                    </textarea>
            </div>
            }
        </div>
        <div class="flex-1">
            <div #mermaidContainer class="mermaid-target"></div>
        </div>
    </div>
</div>
